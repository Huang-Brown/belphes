# Binning configuration for build_templates -- step 2 of the belphes pipeline.
#
# Everything the template grid depends on lives here.  The values are copied
# into the output ROOT file, so the Delphes module reads the binning back from
# the templates rather than having it restated in the card.
#
# Blank lines and #-comments are ignored.  Keys are case-sensitive.

# --- kinematic grid -----------------------------------------------------
# Cell edges.  Any ascending, non-uniform list is fine.
PtBins       20 30 40 50 60 70 80 90 100 120 140 160 180 200 250 300 400 600 1000
AbsEtaBins   0.0 0.5 1.0 1.5 2.0 2.5

# --- truth flavours -----------------------------------------------------
# Jet_hadronFlavour values to build separate template sets for.
# 5 = b, 4 = c, 0 = light (uds + g).
Flavors      5 4 0

# --- output histogram resolution ---------------------------------------
# Score axes of the joint (B, CvL) template.
#
# Uniform fallback, used only if the explicit edges below are removed:
ScoreBinsB     100
ScoreBinsCvL   100
#
# Explicit edges override the counts above.  These are a tanh warp (k=3, 50
# bins) -- narrow near 0 and 1, wider through the middle:
#
#   python3 -c "import math;n,k=50,3.0;r=[math.tanh(k*(i/n-.5)) for i in range(n+1)];
#               print(' '.join('%.6f'%((x-r[0])/(r[-1]-r[0])) for x in r))"
#
# Why not uniform: CvB is derived as C/(C+B) with C = CvL*(1-B), which is
# nonlinear and most sensitive where B is small -- exactly where light and c
# jets sit.  Measured on 4 open-data files, |CvB_truth - CvB_derived| for
# c-jets is 0.0153 with 50x50 uniform bins, 0.0005 with these 50x50 variable
# bins, and 0.0002 with 100x100 uniform.  The warp buys 100x100 accuracy at a
# quarter of the bins, which matters because bins/cell trades directly against
# the statistics in each cell.
ScoreEdgesB    0.000000 0.006325 0.013366 0.021192 0.029876 0.039493 0.050121 0.061840 0.074729 0.088865 0.104320 0.121162 0.139448 0.159222 0.180515 0.203336 0.227676 0.253497 0.280737 0.309305 0.339080 0.369913 0.401629 0.434029 0.466896 0.500000 0.533104 0.565971 0.598371 0.630087 0.660920 0.690695 0.719263 0.746503 0.772324 0.796664 0.819485 0.840778 0.860552 0.878838 0.895680 0.911135 0.925271 0.938160 0.949879 0.960507 0.970124 0.978808 0.986634 0.993675 1.000000
ScoreEdgesCvL  0.000000 0.006325 0.013366 0.021192 0.029876 0.039493 0.050121 0.061840 0.074729 0.088865 0.104320 0.121162 0.139448 0.159222 0.180515 0.203336 0.227676 0.253497 0.280737 0.309305 0.339080 0.369913 0.401629 0.434029 0.466896 0.500000 0.533104 0.565971 0.598371 0.630087 0.660920 0.690695 0.719263 0.746503 0.772324 0.796664 0.819485 0.840778 0.860552 0.878838 0.895680 0.911135 0.925271 0.938160 0.949879 0.960507 0.970124 0.978808 0.986634 0.993675 1.000000

# --- jet selection ------------------------------------------------------
JetPtMin       20.0
JetAbsEtaMax   2.5

# Cells with fewer than this many jets are flagged in the report and marked
# unusable in the output, rather than silently producing a spiky PDF.
MinCellEntries 500
