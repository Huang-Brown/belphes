# Coarse binning for smoke-testing the pipeline on a handful of open-data files.
#
# The production grid in binning.conf needs the full record to fill; with only a
# few files most cells come out empty or single-digit. This config trades all
# resolution for occupancy so the whole chain can be exercised in ~30 seconds.
#
# NOT for physics.

PtBins       20 40 80 200 1000
AbsEtaBins   0.0 1.0 2.5
Flavors      5 4 0

ScoreBinsB     20
ScoreBinsCvL   20

JetPtMin       20.0
JetAbsEtaMax   2.5
MinCellEntries 200
